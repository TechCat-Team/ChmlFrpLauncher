[package]
name = "ChmlFrpLauncher"
version = "0.8.0"
description = "ChmlFrp的官方启动器"
authors = ["南充市轻爪网络科技有限公司 <chaoji@chcat.cn>"]
license = "Apache-2.0"
repository = "https://github.com/TechCat-Team/ChmlFrpLauncher"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
chrono = "0.4"
strip-ansi-escapes = "0.2"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
toml = { version = "0.9", features = ["preserve_order"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", features = ["json"] }
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"

[dependencies.tokio]
version = "1.48"
default-features = false
features = ["rt-multi-thread", "macros", "sync", "time"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
